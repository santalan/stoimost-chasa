name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate source
        run: |
          python -m py_compile run.py
          python -m py_compile bootstrap.py

      - name: GUI startup smoke test
        shell: powershell
        run: |
          python -c "import bootstrap; app=bootstrap.App(); app.update_idletasks(); app.destroy(); print('GUI startup OK')"

      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name "Stoimost-chasa" --collect-all matplotlib --collect-all openpyxl bootstrap.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Stoimost-chasa-Windows
          path: dist/Stoimost-chasa.exe
          if-no-files-found: error
