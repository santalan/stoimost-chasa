name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate source
        run: |
          python -m py_compile run.py
          python -m py_compile bootstrap.py

      - name: GUI startup smoke test
        shell: powershell
        run: |
          python -c "import bootstrap; app=bootstrap.App(); app.update_idletasks(); app.destroy(); print('GUI startup OK')"

      - name: Build portable folder
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name "Stoimost-chasa" --collect-all matplotlib --collect-all openpyxl bootstrap.py

      - name: Verify packaged EXE
        shell: powershell
        run: |
          if (-not (Test-Path "dist\Stoimost-chasa\Stoimost-chasa.exe")) { throw "EXE not found" }
          $p = Start-Process -FilePath "dist\Stoimost-chasa\Stoimost-chasa.exe" -PassThru
          Start-Sleep -Seconds 4
          if ($p.HasExited) { throw "Packaged application exited during startup test" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Packaged EXE startup OK"

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: Stoimost-chasa-Windows-portable
          path: dist/Stoimost-chasa/
          if-no-files-found: error
